[project]
name = "splitwise"
version = "0.1.0"
description = "Split shared expenses with your flatmates."
requires-python = ">=3.11"
dependencies = []

[project.scripts]
splitwise = "splitwise.cli:main"

[dependency-groups]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
